name: Deploy Aletheia to AWS (news.ciclops.io)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test and typecheck step"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-aletheia
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aletheia

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

  deploy:
    name: Provision Infrastructure & Deploy Container
    runs-on: ubuntu-latest
    needs: [validate]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init & Provision Registry
        working-directory: terraform
        run: |
          echo "🚀 Initializing Terraform..."
          terraform init

          echo "📦 Ensuring ECR repository exists..."
          terraform apply \
            -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app \
            -auto-approve

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
          GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}
        run: |
          echo "🐳 Fetching ECR URL from Terraform..."
          ECR_URL=$(terraform -chdir=terraform output -raw ecr_repository_url)
          echo "ECR URL is: $ECR_URL"

          echo "🔑 Authenticating Docker to Amazon ECR..."
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin "$ECR_URL"

          echo "🐳 Building Next.js Standalone Docker Image..."
          docker build \
            --cache-from "$ECR_URL:latest" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="$GA_MEASUREMENT_ID" \
            -t "$ECR_URL:$IMAGE_TAG" \
            -t "$ECR_URL:latest" \
            .

          echo "⬆️ Pushing Docker Image to Amazon ECR..."
          docker push "$ECR_URL:$IMAGE_TAG"
          docker push "$ECR_URL:latest"

      - name: Terraform Full Apply Infrastructure
        working-directory: terraform
        env:
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          TF_VAR_nextauth_secret: ${{ secrets.NEXTAUTH_SECRET }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_test_secret_key: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_ga_measurement_id: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}
        run: |
          echo "📦 Applying Full Terraform Infrastructure..."
          terraform apply -auto-approve

      - name: Sync Runtime Secrets Directly to AWS SSM Parameter Store
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GA_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}
        run: |
          if [ -n "$STRIPE_KEY" ]; then
            echo "Directly syncing STRIPE_SECRET_KEY into AWS SSM..."
            aws ssm put-parameter \
              --name "/aletheia/production/STRIPE_SECRET_KEY" \
              --type "SecureString" \
              --value "$STRIPE_KEY" \
              --overwrite \
              --region ${{ env.AWS_REGION }}
          fi

          if [ -n "$STRIPE_TEST_KEY" ]; then
            echo "Directly syncing STRIPE_TEST_SECRET_KEY into AWS SSM..."
            aws ssm put-parameter \
              --name "/aletheia/production/STRIPE_TEST_SECRET_KEY" \
              --type "SecureString" \
              --value "$STRIPE_TEST_KEY" \
              --overwrite \
              --region ${{ env.AWS_REGION }}
          fi

          if [ -n "$STRIPE_WEBHOOK" ]; then
            echo "Directly syncing STRIPE_WEBHOOK_SECRET into AWS SSM..."
            aws ssm put-parameter \
              --name "/aletheia/production/STRIPE_WEBHOOK_SECRET" \
              --type "SecureString" \
              --value "$STRIPE_WEBHOOK" \
              --overwrite \
              --region ${{ env.AWS_REGION }}
          fi

          if [ -n "$GA_ID" ]; then
            echo "Directly syncing NEXT_PUBLIC_GA_MEASUREMENT_ID into AWS SSM..."
            aws ssm put-parameter \
              --name "/aletheia/production/NEXT_PUBLIC_GA_MEASUREMENT_ID" \
              --type "String" \
              --value "$GA_ID" \
              --overwrite \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Run Database Schema Migrations
        run: |
          echo "Fetching provisioned DATABASE_URL from Terraform output..."
          PROVISIONED_DB_URL=$(terraform -chdir=terraform output -raw database_url)
          echo "Running database schema migrations against RDS PostgreSQL..."
          DATABASE_URL="$PROVISIONED_DB_URL" npm run db:migrate

      - name: Trigger ECS Service Deployment
        run: |
          echo "Triggering zero-downtime rolling update on ECS Fargate..."
          CLUSTER_NAME=$(terraform -chdir=terraform output -raw ecs_cluster_name)
          SERVICE_NAME=$(terraform -chdir=terraform output -raw ecs_service_name)
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for ECS service rollout to complete..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region ${{ env.AWS_REGION }}
          echo "ECS service is live and healthy!"

      - name: Invalidate CloudFront CDN Cache
        run: |
          CF_DIST_ID=$(terraform -chdir=terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
          if [ -n "$CF_DIST_ID" ] && [ "$CF_DIST_ID" != "null" ]; then
            echo "Invalidating CloudFront cache for distribution: $CF_DIST_ID..."
            INVALIDATION_ID=$(aws cloudfront create-invalidation \
              --distribution-id "$CF_DIST_ID" \
              --paths "/*" \
              --query 'Invalidation.Id' \
              --output text)
            echo "Created Invalidation ID: $INVALIDATION_ID"
            aws cloudfront wait invalidation-completed \
              --distribution-id "$CF_DIST_ID" \
              --id "$INVALIDATION_ID"
            echo "CloudFront cache successfully purged!"
          fi

      - name: Deployment Summary
        run: |
          echo "🎉 Deployment successfully completed!"
          echo "Live at https://news.ciclops.io"
