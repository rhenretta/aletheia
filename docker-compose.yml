services:
  aletheia-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aletheia-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://aletheia:aletheia_secret@aletheia-db:5432/aletheia_db
      - REDIS_URL=redis://aletheia-redis:6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./traces:/app/traces
      - ./docs:/app/docs
    depends_on:
      aletheia-db:
        condition: service_healthy
      aletheia-redis:
        condition: service_started
    networks:
      - aletheia-network

  aletheia-db:
    image: pgvector/pgvector:pg16
    container_name: aletheia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia_secret
      POSTGRES_DB: aletheia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/core/storage/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia -d aletheia_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aletheia-network

  aletheia-redis:
    image: redis:7-alpine
    container_name: aletheia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aletheia-network

  caddy-proxy:
    image: caddy:2-alpine
    container_name: aletheia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aletheia-app
    networks:
      - aletheia-network

networks:
  aletheia-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
