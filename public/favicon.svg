<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="alpha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with squircle border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3" />
  
  <!-- Subtle inner glow -->
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.3" />

  <!-- Greek Letter Alpha (α) -->
  <text 
    x="64" 
    y="90" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
    font-size="82" 
    font-weight="bold" 
    text-anchor="middle" 
    fill="url(#alpha-grad)" 
    filter="url(#glow)"
  >α</text>
</svg>
